name: Test Action
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npm test
      - run: node dist/index.js examples/valid_datasheet.md
      - run: node dist/index.js examples/invalid_datasheet.md && exit 1 || exit 0
