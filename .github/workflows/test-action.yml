name: Test Action
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: node dist/index.js examples/valid_datasheet.md
      - run: node dist/index.js examples/invalid_datasheet.md && exit 1 || exit 0
      - run: node dist/index.js
        env:
          INPUT_PATHS: examples/valid_datasheet.md
      - run: node dist/index.js && exit 1 || exit 0
        env:
          INPUT_PATHS: examples/invalid_datasheet.md
      - run: |
          node --input-type=module -e 'import { buildPrComment } from "./dist/index.js"; const body = buildPrComment({ok:false, files:[{path:process.cwd()+"/examples/invalid_datasheet.md", ok:false, kind:"datasheet", missing:["Composition"], piiWarnings:[{pattern:"email", match:"test@example.com"}]}], skipped:[]}); if (!body.includes("<!-- datasheet-ci-summary -->") || !body.includes("Missing Sections") || !body.includes("PII-like email")) process.exit(1);'
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -U build twine pytest
      - run: python -m pip install -e .
        working-directory: python_validator
      - run: pytest
        working-directory: python_validator
      - run: python -m build
        working-directory: python_validator
      - run: twine check dist/*
        working-directory: python_validator
